<style>
:root{--bg:#fff8f3;--card:#fff;--text:#3a2f33;--muted:#706166;--a:#d96862;--a-dark:#a24a45;--a2:#6ca487;--soft:#fdeae4;--soft2:#e8f4ee;--line:#edd7cf;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 78px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 Georgia,"Times New Roman",serif}
h1,h2,h3,nav,.btn,th,.pill,.brand{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
a{color:var(--a-dark)}
a:focus-visible{outline:3px solid #315f91;outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:8px;background:#fff;color:#222;padding:8px 12px;z-index:20}.skip:focus{left:8px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:2px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:center}
.brand{font-weight:700;font-size:1.05rem;color:var(--a);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px}.logo{width:72px;height:auto;object-fit:contain}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
nav a{text-decoration:none;color:var(--text);font-size:.85rem;font-weight:600;padding:5px 12px;border-radius:20px;background:var(--soft);transition:background .2s,color .2s}
nav a:hover,nav a.on{background:var(--a);color:#fff}
.banner{background:linear-gradient(120deg,#ffd9cf,#ffeec9 50%,#d7efe2);padding:42px 18px;text-align:center}
.banner .em{font-size:3rem;letter-spacing:8px}.banner h1{margin:8px 0 4px;font-size:2rem;color:var(--a-dark)}.banner p{margin:0;color:#6c5a5e}
main{max-width:900px;margin:0 auto;padding:22px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:16px 0;box-shadow:0 4px 16px rgba(224,118,111,.08)}
h2{color:var(--a);margin:0 0 8px;font-size:1.4rem}h3{color:var(--a-dark);font-size:1.02rem;margin:0 0 4px}.qa{border-left:5px solid var(--a2);background:var(--soft2);border-radius:0 14px 14px 0;padding:10px 16px;margin:12px 0}.qa p{margin:2px 0}.qa ul{margin:2px 0;padding-left:20px}
.pill{display:inline-block;background:var(--soft);color:var(--a-dark);border-radius:20px;padding:2px 12px;font-size:.82rem;font-weight:700;margin:0 6px 6px 0}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--soft)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mx div{border-radius:12px;padding:10px 12px;font-size:.9rem}.info{background:var(--soft);border-radius:14px;padding:12px 18px;margin-top:24px;font-size:.95rem}.info b{color:var(--a-dark)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{background:var(--a);color:#fff;text-decoration:none;border-radius:22px;padding:8px 18px;font-weight:700;font-size:.9rem}.btn:hover{background:var(--a-dark)}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:16px}.muted{color:var(--muted)}
@media(max-width:560px){.banner{padding:30px 14px}.banner h1{font-size:1.55rem}.card{padding:16px}.mx{grid-template-columns:1fr}nav a{font-size:.78rem;padding:4px 9px}}
@media print{header,.pn,.skip{display:none}.card{box-shadow:none;break-inside:avoid}.banner{padding:20px}}
</style>

extra:'<div class="card"><h2>👩‍⚕️ About Me</h2><p><b>Name:</b> Hilalah Jalawi Al-Anzi<br><b>University ID:</b> 448004258<br><b>Section:</b> BC<br><b>Group:</b> C</p><h3>👥 My Group</h3><p><b>Group leader:</b> Alanoud Moubarak Nasser Almouh (448004056)<br><b>Members:</b> Rimas Ayed Turki Alqahtani (448004315), Jana Hanash Saeed Al Salman (448005675), and Khuzama Khalid Trad Al Ruwaili.</p><p class="muted">Working with this group gave me opportunities to practise respectful discussion, shared responsibility and constructive feedback.</p></div><div class="card"><h2>🗓️ My Activities</h2><div class="wrap"><table><thead><tr><th>Activity</th><th>Date</th></tr></thead><tbody><tr><td>💬 Tutorial 1: Communication Skills</td><td>29 September 2026</td></tr><tr><td>🩺 Tutorial 2: Problem-Based Learning</td><td>11 October 2026</td></tr><tr><td>🧠 Tutorial 4: Critical Thinking</td><td>20 October 2026</td></tr><tr><td>⏱️ Tutorial 5: Time Management</td><td>27 October 2026</td></tr><tr><td>🥤 Tutorial 3: Team-Based Learning</td><td>3 November 2026</td></tr></tbody></table></div></div>'},
tutorial1:{n:"Tutorial 1",e:"💬 🗣️ 💬",t:"Tutorial 1: Communication Skills",s:"Breaking Bad News · 29 September 2026",ov:"Effective communication is essential for professional and personal development in healthcare. In this role-play, one member played a patient receiving a biopsy result that suggested a malignant tumour, and another played the physician who had to break the news. Afterwards, the group reflected on what went well and what could be improved. Our group participated in the role-play, contributed to the feedback and took part in the final discussion.",qa:[Q("Was anyone frustrated, and how was it handled?","Yes. Some of us felt tense because the situation was emotional and we were performing in front of peers. We reassured one another and focused on specific, constructive feedback rather than personal criticism. This helped us turn nervousness into a learning opportunity."),Q("What did you learn about yourself and others?","We learned that respectful listening under pressure is essential and that we should not rush to offer reassurance before acknowledging feelings. We also recognised that group members differ in their comfort with silence, eye contact and emotional expression, so reflection helped us improve together."),Q("Why are good communication skills important in this scenario?","The way bad news is delivered affects a patient's emotions, trust and ability to cope. Clear, compassionate communication allows the patient to ask questions, understand the next steps and feel supported rather than abandoned."),Q("What was challenging?","The main challenge was balancing accurate medical information with compassion and realistic hope. It was also difficult to use simple language without medical jargon while responding sensitively to an emotional reaction."),Q("What skills are needed for good communication?","<ul><li>Empathy and emotional awareness</li><li>Active listening and appropriate silence</li><li>Clear, simple language</li><li>Respectful eye contact and body language</li><li>Checking understanding and inviting questions</li><li>Giving the patient enough time to respond</li></ul>"),Q("What are your communication strengths, and what needs improvement?","Our communication strengths are respect, active listening and avoiding interruption. We need to improve our responses to unexpected questions and manage nervous body language. We will practise pausing, breathing and using a clear structure before responding."),Q("How can you use this outside the classroom?","We can use these skills with patients, families, colleagues and friends by listening before advising, acknowledging emotions and explaining information in a way others can understand.")]},
tutorial2:{n:"Tutorial 2",e:"🩺 🫁 🩺",t:"Tutorial 2: Problem-Based Learning (PBL)",s:"Case of Norah · 11 October 2026",ov:"Norah, a 28-year-old teacher and part-time swimming instructor, had recurring chest pain and shortness of breath that were gradually worsening. After becoming too breathless to walk following a swimming competition, we used the PBL process to analyse the case. Our group contributed to the initial hypotheses, learning issues and source-searching, then shared the findings together.",qa:[Q("PBL steps: clarify terms, identify the problem and suggest causes","We clarified terms such as chest pain, dyspnoea and exercise intolerance. Our initial differential included pulmonary embolism, pneumonia, asthma, exercise-related muscle strain, stress and anaemia. We recognised that these were hypotheses, not a diagnosis, and that further assessment was essential."),Q("What further information and learning issues were needed?","We identified the need for a history, physical examination, vital signs, ECG, cardiac troponin, blood tests, chest X-ray and—if clinically indicated—CT imaging. Our learning issues included pulmonary embolism, anaemia, asthma and the clinical approach to exertional dyspnoea."),Q("What main problems did the group face, and how were they handled?","The main difficulty was turning broad possibilities into focused, clinically relevant differentials. We managed this by defining the problem, grouping related causes, asking what evidence would support or contradict each hypothesis, and recording unanswered questions for independent study."),Q("How did your group implement PBL, and what were the roles?","We clarified the case, defined the problems, generated hypotheses, set learning objectives, divided research topics and shared our findings. The leader guided the discussion and monitored the process, while each member contributed ideas and evidence. This made the work structured and collaborative."),Q("What skills are needed for good PBL?","Communication, active listening, critical thinking, teamwork, time management, information literacy and the ability to evaluate evidence rather than accept the first explanation."),Q("How did you perform, and what did you learn?","We worked cohesively and completed the required stages efficiently. We learned to connect basic science with a realistic clinical problem, tolerate uncertainty at the beginning of a case and value different perspectives before reaching a conclusion.")]},
tutorial3:{n:"Tutorial 3",e:"🥤 🤝 🥤",t:"Tutorial 3: Team-Based Learning",s:"Cup Stack Challenge · 3 November 2026",ov:"This hands-on challenge tested patience, communication and perseverance. Each member held one string attached to a single rubber band, and together we used it to pick up cups and stack them into a pyramid. Each group member held one string and coordinated movements with the team. The activity showed that a shared goal requires every person to contribute consistently.",qa:[Q("Was anyone frustrated, and how was it handled?","At first the rubber band slipped and the cups fell, which was frustrating. We paused, reminded ourselves of the goal, improved our communication and adjusted our grip. Taking a short reset was more effective than blaming one another."),Q("What did you learn about yourself or others?","We learned that patience and controlled movements are more useful than rushing. We also noticed that teams need someone to help coordinate while all members listen and cooperate. A calm mindset supports better performance."),Q("Why are teamwork skills important here?","Because everyone holds a string connected to one rubber band, nobody can complete the task alone. Success depends on trust, shared effort, synchronised movement and the willingness to adapt when the first plan does not work."),Q("What was challenging?","Maintaining steady tension was difficult. When one person pulled too hard or lost focus, the cups fell and we had to recalibrate. This was a practical lesson in how one individual's action can affect the whole team."),Q("What skills are needed for good teamwork?","Listening, empathy, patience, clear communication, coordination, shared leadership, adaptability and the ability to encourage others."),Q("What are your teamwork strengths, and what needs improvement?","Our strengths were mutual encouragement, listening and staying positive. We need to improve quick decision-making under pressure and use clearer non-verbal cues when speaking is difficult."),Q("How can you use this outside the classroom?","In future group projects and healthcare teams, we can apply the same principles by clarifying roles, communicating early, respecting each contribution and speaking up when coordination or patient safety may be affected.")]},
tutorial4:{n:"Tutorial 4",e:"🧠 💡 🧠",t:"Tutorial 4: The 4Cs – Critical Thinking",s:"Vaccine scenario · 20 October 2026",ov:"A family member shared a documentary claiming that vaccines are harmful. It used the term “dihydrogen monoxide” and repeated the false claim that vaccines cause autism. We evaluated the argument scientifically and logically. Our group helped assess the claims and prepare a respectful, evidence-based response.",qa:[Q("How would you evaluate the statement?","The statement is misleading because it uses a technical-sounding term to create fear and presents a complex safety question as a simple accusation. A reliable evaluation requires checking the source, examining the evidence, distinguishing correlation from causation and comparing the claim with the wider scientific literature."),Q("What would you say to your family member?","I would listen first and ask what specifically concerned them. I would explain that “dihydrogen monoxide” is simply the chemical name for water (H2O), and that vaccine safety is assessed through clinical studies and continuous monitoring. I would avoid dismissing their concern and suggest discussing personal medical questions with a qualified healthcare professional."),Q("Analyse the scientific basis and logical reasoning","The argument relies on unfamiliar terminology, emotional language and a conclusion that does not follow from the premises. The autism claim was associated with a discredited paper that was retracted because of serious problems with its data. Strong critical thinking means looking for reproducible evidence, credible sources, transparent methods and the consensus of high-quality research—not relying on one dramatic story."),Q("What did you learn and what will you improve?","We learned that correcting misinformation requires both evidence and empathy. In future, we will slow down before sharing information, check the original source and explain uncertainty honestly. We will also practise asking open questions so that conversations remain respectful rather than becoming arguments.")]},
tutorial5:{n:"Tutorial 5",e:"⏱️ 📅 ⏱️",t:"Tutorial 5: Time Management Skills",s:"Time Management Challenge · 27 October 2026",ov:"We had five minutes to prioritise 18 tasks using the four Ds—Do, Defer, Delegate and Delete—and the urgent/important matrix. Our group helped sort the tasks, explain the reasoning behind each category and agree on the final decisions. The activity demonstrated that time management is a decision-making skill, not simply a matter of working faster.",extra:'<div class="card"><h2>Our Matrix</h2><div class="mx"><div style="background:#d9f0e0"><b>DO</b><br>Essential enquiries, important reports, office crises, deadlines and major work issues.</div><div style="background:#fff2c4"><b>DEFER</b><br>Family time, appointments, exercise, new ideas and project planning.</div><div style="background:#dbe8ff"><b>DELEGATE</b><br>Orders, meetings, administrative tasks and booking flights.</div><div style="background:#ffd9d9"><b>DELETE</b><br>Email distractions, excessive television, social media and unnecessary calls.</div></div></div>',qa:[Q("What main problems did the group face, and how were they handled?","The time limit and number of tasks made decisions difficult. We used rapid triage, discussed the consequences of delay and delegated less critical tasks. Clear communication helped us avoid spending too long debating one item."),Q("How did your group implement time management?","We used the Eisenhower matrix and the four Ds: we completed urgent and important tasks first, scheduled important but less urgent tasks, delegated work that another person could complete and removed distractions that added little value."),Q("What skills are needed for good time management?","Prioritisation, planning, flexibility, delegation, leadership, focus and stress control. It is also important to estimate time realistically and review priorities when circumstances change."),Q("How did you perform as a group?","We communicated well, made decisions together and completed the matrix within the time limit. Our main strength was shared participation; our improvement area is making a quick final review so that categories are consistent."),Q("What did you learn about yourself or others?","Our members have different working styles: some respond well in a crisis, while others prefer long-term planning. We also recognised that digital notifications can interrupt concentration and make minor tasks feel more urgent than they are."),Q("What will you do differently to improve?","We will use weekly planning and daily time-blocking, silence unnecessary notifications, break large assignments into smaller actions and review our priorities at the end of each day. We will apply the four Ds to our studies instead of treating every task as equally urgent.")]},
